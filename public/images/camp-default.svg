<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Medical Cross Symbol -->
  <g transform="translate(400, 220)">
    <!-- Outer Glow Circle -->
    <circle r="90" fill="rgba(255, 255, 255, 0.12)" />
    <circle r="75" fill="#ffffff" />
    
    <!-- Red Cross -->
    <path d="M -15,-45 L 15,-45 L 15,-15 L 45,-15 L 45,15 L 15,15 L 15,45 L -15,45 L -15,15 L -45,15 L -45,-15 L -15,-15 Z" fill="#0d9488" />
  </g>

  <!-- Pulse Line Accent -->
  <path d="M 150,380 L 320,380 L 340,340 L 360,420 L 380,360 L 400,400 L 420,380 L 650,380" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Text -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    COMMUNITY MEDICAL OUTREACH CAMP
  </text>
  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#ccfbf1" text-anchor="middle">
    Free Healthcare Screenings &amp; Specialist Consultations
  </text>
</svg>
